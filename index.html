<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photography Contest Registration</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to right, #141e30, #243b55);
        }

        .container {
            width: 420px;
            margin: 50px auto;
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: crimson;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }

        input[type="text"],
        input[type="email"],
        input[type="file"] {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .radio-group {
            margin-top: 8px;
        }

        .radio-group label {
            font-weight: normal;
            display: block;
            margin-left: 5px;
        }

        .checkbox {
            margin-top: 15px;
            font-size: 14px;
        }

        .submit-btn {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: crimson;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: darkred;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Photography Contest</h1>

    <form>
        <label>Participant Name</label>
        <input type="text" required>

        <label>Instagram ID</label>
        <input type="text" required>

        <label>Email Address</label>
        <input type="email" required>

        <label>Photography Style</label>
        <div class="radio-group">
            <label><input type="radio" name="style" required> Landscape</label>
            <label><input type="radio" name="style"> Portrait</label>
            <label><input type="radio" name="style"> Wildlife</label>
            <label><input type="radio" name="style"> Fashion</label>
            <label><input type="radio" name="style"> Architectural</label>
            <label><input type="radio" name="style"> Other</label>
        </div>

        <label>Upload Photograph</label>
        <input type="file" required>

        <div class="checkbox">
            <input type="checkbox" required>
            I confirm that this photograph is taken by me.
        </div>

        <button type="submit" class="submit-btn">Register</button>
    </form>
</div>

</body>
</html>
