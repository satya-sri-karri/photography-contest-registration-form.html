<!DOCTYPE html>
<html>
    <head>
        <title>
            Photography contest registration.
        </title>
    </head>
    <body>
        
        <center>
        <h1 style="text-align:center;color: crimson;",>Photography contest📸</h1>
        <form>
            <table style="width:604px;">
                <tr >
                    <td style="padding: 8px;"><label>participant name</label></td>
                    <td style="padding: 8px;"><input type="text"></td>
                </tr>
                <tr >
                    <td style="padding: 8px;"><label>Instagram Id</label></td>
                    <td style="padding: 8px;"><input type="text" required></td>
                </tr>
                <tr>
                    <td style="padding: 8px;">
                        <label>enter the email</label>
                    </td>
                    <td style="padding: 8px;"><input type="email" required></td>
                </tr>
                <tr >
                    <td style="padding: 8px;"><label>Select the photography style</label></td>
                </tr>
                <tr ><td><input type="radio" name="style">Landscape</td></tr>
                <tr ><td><input type="radio" name="style">Potrait</td></tr>
                <tr ><td><input type="radio" name="style">WildLife</td></tr>
                <tr ><td><input type="radio" name="style">Fashion</td></tr>
                <tr ><td><input type="radio" name="style">Architectural</td></tr>
                <tr ><td><input type="radio" name="style">Other</td></tr>
                <tr >
                    <td style="padding: 8px;"><label >Upload the photo</label></td>
                    <td style="padding: 8px;"><input type="file" required></td>
                </tr>
                <tr>
                    <td style="padding: 8px;">
                        <input type="checkbox"required>I confirm that this photograph is taken by me.
                    </td>
                </tr>
                <tr>
                    <td style="padding: 8px;">
                        <input type="submit">
                    </td>
                </tr>
             </table>
        </form>
       
        </center>
    </body>
</html>
